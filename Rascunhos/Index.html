
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container1{
            background-color: aqua;
            width: 25%;
            height: 150px;
            box-sizing: border-box;
            border-radius: 10px;
            border: black 2px solid;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .container2{
            background-color: blue;
            width: 25%;
            height: 150px;
            box-sizing: border-box;
            border-radius: 10px;
            border: black 2px solid;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .container3{
            background-color: brown;
            width: 25%;
            height: 150px;
            box-sizing: border-box;
            border-radius: 10px;
            border: black 2px solid;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        @media (min-width: 320px) and (max-width: 374px){
            .container1{
                display: block;

            }
            .container2,
            .container3{
                display: none;
            }

            

            
        }


        @media (min-width: 375px) and (max-width: 1439px){
            .container2{
                display: block;

            }
            .container1,
            .container3{
                display: none;
            }
            
        }

        @media  (min-width: 1440px){
            .container3{
                display: block;

            }
            .container1,
            .container2{
                display: none;
            }

            

            
        }
    </style>
</head>
<body>
    <div class="container1">
        <h1>1</h1>
    </div>
    <div class="container2">
        <h1>2</h1>
    </div>
    <div class="container3">
        <h1>3</h1>
    </div>
</body>
</html>
